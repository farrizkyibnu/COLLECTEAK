<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>COLLECTEAK · DJ mascot intro</title>
<style>
:root{--mut:#8a8f98;--p:40px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04070f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* opening: maskot berlari masuk, ngerem ngepot, mengeluarkan CDJ lalu scratch. Semua digambar SVG (badan/sarung tangan/sepatu dari logo, tangan+kaki selang karet) */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.ip{position:absolute;left:0;right:0;height:50.3%;background:#000}.ip.top{top:0}.ip.bot{bottom:0}
#istage{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible;pointer-events:none;opacity:0} /* tampil setelah script siap, supaya tidak ada kilatan adegan mentah saat halaman masih loading */
.ic,.iskip{position:absolute;z-index:3;bottom:28px;font:500 12px "Plus Jakarta Sans",sans-serif;letter-spacing:.08em;color:var(--mut)}
.ic{right:var(--p);font-variant-numeric:tabular-nums}
.iskip{left:var(--p);background:none;border:0;cursor:pointer;text-transform:uppercase}

/* halaman placeholder di balik tirai + tombol replay (hanya untuk file demo ini) */
.demo{position:fixed;inset:0;display:grid;place-items:center;text-align:center;gap:14px;align-content:center}
.demo h1{margin:0;font-size:clamp(28px,6vw,64px);letter-spacing:.02em}
.demo p{margin:0;color:var(--mut);font-size:14px}
.replay{margin-top:10px;padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);color:#fff;font:600 14px inherit;cursor:pointer;transition:background .2s}
.replay:hover{background:rgba(255,255,255,.16)}
</style></head>
<body>
<div class="demo"><h1>COLLECTEAK</h1><p>Intro selesai. Tekan <b>R</b> atau klik Replay untuk mengulang.</p><button class="replay" type="button" onclick="location.reload()">Replay ↻</button></div>

<script>
/* ============================================================
   COLLECTEAK · DJ mascot intro (file animasi mandiri)
   Urutan: lari masuk -> ngerem/ngepot -> keluarin CDJ -> scratch -> keluar (tirai terbelah)
   Pakai di situs: salin <svg id="istage"> + CSS + blok JS ini; sediakan variabel
   `intro` (elemen #intro), `$` (querySelector), `heroTl` (timeline hero, .play() dipanggil saat tirai terbuka) dan `lenis` (opsional).
   ============================================================ */

  const $ = (s) => document.querySelector(s), intro = $('#intro'), lenis = null;
  const heroTl = { play() { document.body.classList.add('done'); } };
  addEventListener('keydown', (e) => (e.key === 'r' || e.key === 'R') && location.reload());

      .forEach((n) => (E[n] = [...svg.querySelectorAll(`[data-p="${n}"]`)])); /* tiap bagian ada 2: lapisan outline putih + lapisan warna */
    const all = (n, f) => E[n].forEach(f);
    const fit = () => { /* skala adegan mengikuti layar (meja DJ ±1060 unit lebar); viewBox mengikuti rasio layar */
      const k = innerWidth >= innerHeight ? Math.min((innerHeight * 0.6) / 760, (innerWidth * 0.82) / 1060) : (innerWidth * 0.94) / 1060;
      const Wv = innerWidth / k, Hv = innerHeight / k;
      svg.setAttribute('viewBox', `${350 - Wv / 2} ${370 - Hv / 2} ${Wv} ${Hv}`);
      return Wv;
    };
    let Wv = fit(); addEventListener('resize', () => (Wv = fit()));
    document.documentElement.style.overflow = 'hidden'; lenis && lenis.stop();
    const tl = gsap.timeline({ paused: true, onComplete: () => { intro.remove(); document.documentElement.style.overflow = ''; lenis && lenis.start(); } });

    /* ---------- RIG ----------
       Maskot menghadap KIRI: lari dari kanan ke kiri layar. Badan/sarung tangan/sepatu = trace vektor logo; tangan & kaki = selang karet.
       Setup DJ: CDJ kiri + mixer + CDJ kanan. Tangan kiri (layar) menggeser crossfader mixer, tangan kanan menyentuh jog wheel CDJ kanan (scratch).
       pose = 20 angka: wristL(2) wristR(2) ankleL(2) ankleR(2) | bulge armL(2) armR(2) legL(2) legR(2) | rot shoeL shoeR + tambahan rot gloveL gloveR */
    const REST = [88, 214, 615, 388, 302, 506, 437, 497, -41, 52, 50, -49, 8, 6, -16, 34, 0, 0, 0, 0];
    const BRAKE = [55, 120, 665, 170, 215, 550, 140, 525, -30, 20, 40, -10, -30, -40, -30, -40, 35, 40, 0, 0];
    const run = (p) => { const c = Math.cos, s = Math.sin, m = Math.max, a = p, b = p + Math.PI;
      return [80 - 35 * s(p), 255 + 75 * c(p + .5), 620 + 35 * s(p), 345 - 75 * c(p + .5),
        330 - 100 * s(a), 520 - 62 * m(0, c(a)), 395 - 100 * s(b), 520 - 62 * m(0, c(b)),
        -35, 35, 40, -35, -18, 0, -18, 0, 22 * c(a), 22 * c(b), 0, 0]; };
    const S = { bx: Wv / 2 + 450, by: 0, br: -7, sx: 1, sy: 1, tw: 0, ph: 0, dk: 0, pr: 0, pl: 0, ja: 0, kxo: 0, lq: 0, lift: 1, llift: 1, eq: 0, nod: 0, nod2: 0, sway: 0, w: { rest: 0, run: 1, brake: 0, dj: 0 }, thL: 0, thR: 0 };
    const SH_L = [150, 303], SH_R = [536, 306], HIP_L = [335, 392], HIP_R = [356, 395];
    const limb = (x0, y0, x1, y1, bx, by) => `M${x0} ${y0}Q${(x0 + x1) / 2 + bx} ${(y0 + y1) / 2 + by} ${x1} ${y1}`;
    /* sudut sarung tangan mengikuti arah lengan di pergelangan (kiri: acuan "atas", kanan: acuan "bawah") */
    const tang = (sh, wx, wy, bx, by) => [wx - ((sh[0] + wx) / 2 + bx), wy - ((sh[1] + wy) / 2 + by)];
    const REF_L = (() => { const t = tang(SH_L, REST[0], REST[1], REST[8], REST[9]); return Math.atan2(t[0], -t[1]) * 180 / Math.PI; })();
    const REF_R = (() => { const t = tang(SH_R, REST[2], REST[3], REST[10], REST[11]); return Math.atan2(-t[0], t[1]) * 180 / Math.PI; })();
    all('gcL', (e) => e.setAttribute('transform', `rotate(${REF_L + 180}) scale(-1 1)`)); all('gcR', (e) => e.setAttribute('transform', `rotate(${REF_R})`));
        const unwrap = (a, prev) => { while (a - prev > 180) a -= 360; while (a - prev < -180) a += 360; return a; };
    /* cari posisi pergelangan agar tangan (sepanjang len) tepat menempel di titik kontak (cx,cy) */
    const reach = (sh, cx, cy, bx, by, len) => { let wx = cx, wy = cy;
      for (let i = 0; i < 4; i++) { const t = tang(sh, wx, wy, bx, by), n = Math.hypot(t[0], t[1]) || 1; wx = cx - (len * t[0]) / n; wy = cy - (len * t[1]) / n; }
      return [wx, wy]; };
    const JOG = [664.2, 598.4], JOGL = [35.7, 598.4], XF_Y = 643.9, EQ = [314.6, 557.8];
    const DJB = 60; /* badan merunduk 60 unit di belakang meja */
    let dkShown = false, lastCnt = '', lastCg = -1;
    function render() {
      const w = S.w, P = new Array(20).fill(0);
      /* titik kontak: kanan = busur di jog wheel (sudut = 215 + ja), kiri = crossfader -> knob EQ (lq 0..1); lift = tangan terangkat dari permukaan */
      const ang = ((215 + S.ja) * Math.PI) / 180, kx = 350 + S.kxo;
      const rcx = JOG[0] + 75 * Math.cos(ang), rcy = JOG[1] + 75 * 0.41 * Math.sin(ang) - 24 * S.lift;
      const lcx = kx + (EQ[0] - kx) * S.lq, lcy = XF_Y - 12 + (EQ[1] - 8 - (XF_Y - 12)) * S.lq - 24 * S.llift;
      const wl = reach(SH_L, lcx, lcy - DJB, -95, 35, 70), wr = reach(SH_R, rcx, rcy - DJB, 95, 10, 70);
      const DJ = [wl[0], wl[1], wr[0], wr[1], 300, 585, 405, 590, -95, 35, 95, 10, -20, 30, 20, 30, 0, 0, 0.18 * S.eq, -0.25 * S.ja];
      const R = run(S.ph);
      for (let i = 0; i < 20; i++) P[i] = REST[i] * w.rest + R[i] * w.run + BRAKE[i] * w.brake + DJ[i] * w.dj;
      const dA = limb(SH_L[0], SH_L[1], P[0], P[1], P[8], P[9]), dB = limb(SH_R[0], SH_R[1], P[2], P[3], P[10], P[11]);
      const dC = limb(HIP_L[0], HIP_L[1], P[4], P[5], P[12], P[13]), dD = limb(HIP_R[0], HIP_R[1], P[6], P[7], P[14], P[15]);
      all('armL', (e) => e.setAttribute('d', dA)); all('armR', (e) => e.setAttribute('d', dB));
      all('legL', (e) => e.setAttribute('d', dC)); all('legR', (e) => e.setAttribute('d', dD));
      const tL = tang(SH_L, P[0], P[1], P[8], P[9]), tR = tang(SH_R, P[2], P[3], P[10], P[11]);
      S.thL = unwrap(Math.atan2(tL[0], -tL[1]) * 180 / Math.PI, S.thL); S.thR = unwrap(Math.atan2(-tR[0], tR[1]) * 180 / Math.PI, S.thR);
      const gl = S.thL - REF_L + P[18], gr = S.thR - REF_R + P[19];
      const T = (x, y, r, k = 1) => `translate(${x} ${y}) rotate(${r}) scale(${k})`, shk = Math.max(0.001, 1 - w.dj * 1.6);
      all('gloveL', (e) => e.setAttribute('transform', T(P[0], P[1], gl))); all('gloveR', (e) => e.setAttribute('transform', T(P[2], P[3], gr)));
      /* sarung tangan kepalan (lari/ngerem) cross-fade ke tangan telapak datar (main DJ) */
      const cg = Math.round(Math.max(0, Math.min(1, (w.dj - 0.25) / 0.5)) * 20) / 20;
      if (cg !== lastCg) { lastCg = cg; ['gsL', 'gsR'].forEach((n) => all(n, (e) => e.setAttribute('opacity', 1 - cg))); ['gcL', 'gcR'].forEach((n) => all(n, (e) => e.setAttribute('opacity', cg))); }
      all('shoeL', (e) => e.setAttribute('transform', T(P[4], P[5], P[16], shk))); all('shoeR', (e) => e.setAttribute('transform', T(P[6], P[7], P[17], shk)));
      const bob = -16 * Math.abs(Math.sin(S.ph)) * w.run + 5 * S.nod * w.dj, tilt = (0.04 * S.ja + 1.1 * S.sway) * w.dj;
      const body = `translate(${S.bx} ${S.by + bob}) translate(350 560) rotate(${S.br + tilt}) scale(${S.sx * (1 - 0.26 * S.tw)} ${S.sy}) skewX(${-14 * S.tw}) translate(-350 -560)`;
      all('cb', (e) => e.setAttribute('transform', body)); all('cf', (e) => e.setAttribute('transform', body));
      const dkOn = S.dk > 0.01, dk = `translate(350 712) scale(${Math.max(S.dk, 0.001)}) translate(-350 -712)`;
      all('dk', (e) => { if (dkOn) e.setAttribute('transform', dk); if (dkOn !== dkShown) e.style.display = dkOn ? '' : 'none'; }); dkShown = dkOn;
      if (dkOn) {
        all('plat', (e) => e.setAttribute('transform', `translate(${JOG[0]} ${JOG[1]}) scale(1 .41) rotate(${S.pr * 1.4 + S.ja})`));
        all('platL', (e) => e.setAttribute('transform', `translate(${JOGL[0]} ${JOGL[1]}) scale(1 .41) rotate(${S.pl})`));
        all('led', (e) => e.setAttribute('stroke-opacity', 0.55 + 0.45 * S.nod));
        all('knob', (e) => e.setAttribute('transform', `translate(${kx} ${XF_Y})`));
        all('eqi', (e) => e.setAttribute('transform', `rotate(${S.eq} ${e.dataset.cx} ${e.dataset.cy})`));
        /* VU mengikuti ketukan: channel 0/2 = kick di ketukan, channel 1/3 = hi-hat di off-beat */
        const lv = [0.12 + 0.8 * S.nod, 0.12 + 0.8 * S.nod2, 0.1 + 0.7 * S.nod, 0.1 + 0.7 * S.nod2];
        all('vu', (e) => e.setAttribute('fill-opacity', lv[+e.dataset.c] > (+e.dataset.k + 0.5) / 5 ? 1 : 0.22));
      }
      all('spd', (e) => { e.setAttribute('transform', `translate(${S.bx + 14 * Math.sin(S.ph * 2)} 0)`); e.setAttribute('opacity', 0.5 * w.run); });
    }

    /* ---------- EFEK (debu, kilau, not) ---------- */
    const mk = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); return e; };
    const puff = (x, y, k = 1, dir = 1) => { const c = mk('circle', { cx: x, cy: y, r: 8 * k, fill: '#e9edf3', 'fill-opacity': 0.6 }); fx.appendChild(c);
      gsap.to(c, { attr: { r: (30 + Math.random() * 22) * k, cx: x + dir * (30 + Math.random() * 70 * k), cy: y - 18 - Math.random() * 40, 'fill-opacity': 0 }, duration: 0.55 + Math.random() * 0.3, ease: 'power2.out', onComplete: () => c.remove() }); };
    const spark = (x, y, k = 1) => { const p = mk('path', { d: 'M0 -14Q2 -2 14 0Q2 2 0 14Q-2 2 -14 0Q-2 -2 0 -14Z', fill: '#fff' }), o = { v: 0 }; fx.appendChild(p);
      gsap.to(o, { v: 1, duration: 0.45, ease: 'power2.out', yoyo: true, repeat: 1, onUpdate: () => p.setAttribute('transform', `translate(${x} ${y}) rotate(${o.v * 70}) scale(${o.v * k * 1.5})`), onComplete: () => p.remove() }); };
    const note = (x, y) => { const g = mk('g', {}), o = { t: 0 };
      g.appendChild(mk('ellipse', { rx: 9, ry: 6.5, transform: 'rotate(-20)', fill: '#fff' }));
      g.appendChild(mk('path', { d: 'M8 -3V-36Q22 -30 22 -16', fill: 'none', stroke: '#fff', 'stroke-width': 4, 'stroke-linecap': 'round' })); fx.appendChild(g);
      gsap.to(o, { t: 1, duration: 1.3, ease: 'none', onUpdate: () => { g.setAttribute('transform', `translate(${x + 16 * Math.sin(o.t * 7)} ${y - 130 * o.t})`); g.setAttribute('opacity', Math.min(1, o.t * 6) * (1 - o.t)); }, onComplete: () => g.remove() }); };

    /* ---------- TIMELINE ---------- */
    const T0 = 0.1, RUN = 0.85, TB = T0 + RUN, TS = 1.9, SC = TS + 0.9;
    /* 1) lari masuk dari kanan layar ke kiri (melangkah maju) */
    tl.to(S, { bx: 260, duration: RUN, ease: 'none' }, T0).to(S, { ph: (RUN / 0.3) * Math.PI * 2, duration: RUN, ease: 'none' }, T0);
    /* 2) ngerem + ngepot: badan condong ke belakang, kaki meluncur ke depan, badan "meliuk" (skew + squash) sambil menggeser, debu beterbangan */
    tl.to(S.w, { run: 0, brake: 1, duration: 0.12, ease: 'power2.out' }, TB)
      .to(S, { br: 22, sy: 0.93, sx: 1.06, by: 8, duration: 0.16, ease: 'power2.out' }, TB)
      .to(S, { bx: 0, duration: 0.95, ease: 'power3.out' }, TB)
      .to(S, { tw: 1, duration: 0.28, ease: 'power2.out' }, TB + 0.1).to(S, { tw: 0, duration: 0.7, ease: 'elastic.out(1,0.45)' }, TB + 0.38);
    for (let i = 0; i < 10; i++) tl.call(() => puff(S.bx + 230 + Math.random() * 130, 650 + Math.random() * 14, 1, 1), null, TB + 0.05 + i * 0.075);
    /* 3) berdiri, lompat kecil, setup CDJ + mixer "dikeluarkan" (pop + debu + kilau), badan merunduk di belakang meja */
    tl.to(S.w, { brake: 0, rest: 1, duration: 0.25, ease: 'power2.out' }, TS)
      .to(S, { br: 0, sx: 1, sy: 1, duration: 0.3, ease: 'back.out(2)' }, TS)
      .to(S, { by: -38, duration: 0.14, ease: 'power2.out' }, TS + 0.05).to(S, { by: 0, duration: 0.14, ease: 'power2.in' }, TS + 0.19)
      .to(S, { by: DJB, duration: 0.35, ease: 'power2.inOut' }, TS + 0.4)
      .to(S, { dk: 1, duration: 0.6, ease: 'back.out(2)' }, TS + 0.3).to(S, { pr: 150, duration: SC - TS - 0.3, ease: 'none' }, TS + 0.3).to(S, { pl: 520, duration: 3.6, ease: 'none' }, TS + 0.3)
      .call(() => { for (let i = 0; i < 9; i++) puff(-90 + i * 110, 708, 1.2, i < 4 ? -1 : 1); spark(-90, 520, 1); spark(790, 520, 1.2); spark(350, 468, 0.9); }, null, TS + 0.32)
      .to(S.w, { rest: 0, dj: 1, duration: 0.45, ease: 'power2.inOut' }, TS + 0.45);
    /* 4) main DJ: 128 BPM, 1 bar (4 ketukan) -- tiap gerakan jatuh di ketukan:
         A (ketukan 1-2)  baby scratch: tangan kanan mendorong/menarik jog wheel tiap 1/8 nada, crossfader dibiarkan terbuka
         B (ketukan 3)    transformer: jog digerakkan cepat tiap 1/16 dan tangan kiri memotong crossfader serempak
         C (ketukan 4)    lepas: tangan kanan terangkat, jog berputar bebas, tangan kiri pindah ke knob EQ lalu memutarnya */
    const BPM = 128, B = 60 / BPM, q = B / 2, s16 = B / 4;
    tl.to(S, { lift: 0, llift: 0, duration: 0.18, ease: 'power2.in' }, SC - 0.18).to(S, { kxo: 58, duration: 0.2, ease: 'power2.out' }, SC - 0.2);
    for (let k = 0; k < 4; k++) { /* denyut ketukan: kepala/badan ngangguk, lampu LED + VU, dan not */
      tl.fromTo(S, { nod: 1 }, { nod: 0, duration: 0.34, ease: 'power3.out', immediateRender: false }, SC + k * B)
        .fromTo(S, { nod2: 1 }, { nod2: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, SC + k * B + q)
        .to(S, { sway: k % 2 ? 1 : -1, duration: B, ease: 'sine.inOut' }, SC + k * B)
        .call(() => note(k % 2 ? 770 : -70, 480), null, SC + k * B + 0.02);
    }
    [34, -26, 34].forEach((v, n) => tl.to(S, { ja: v, duration: q * 0.86, ease: 'power2.inOut' }, SC + n * q));                      /* A */
    const TB2 = SC + 3 * q;
    [30, -22, 30, -22].forEach((v, n) => tl.to(S, { ja: v, duration: s16 * 0.8, ease: 'power2.inOut' }, TB2 + n * s16)             /* B: jog + cut serempak */
      .to(S, { kxo: n % 2 ? 14 : 62, duration: s16 * 0.55, ease: 'power3.out' }, TB2 + n * s16));
    const TC = TB2 + 4 * s16;
    tl.to(S, { lift: 1, duration: 0.16, ease: 'power2.out' }, TC).to(S, { ja: 0, duration: 0.16, ease: 'power2.out' }, TC)             /* C: lepas jog, jog muter bebas */
      .to(S, { pr: '+=70', duration: 0.6, ease: 'none' }, TC)
      .to(S, { llift: 1, duration: 0.1, ease: 'power2.out' }, TC + 0.02).to(S, { lq: 1, duration: 0.16, ease: 'power2.inOut' }, TC + 0.08)
      .to(S, { llift: 0, duration: 0.1, ease: 'power2.in' }, TC + 0.2).to(S, { eq: 75, duration: 0.34, ease: 'power1.inOut' }, TC + 0.3);
    const F = TC + 0.8;
    const prog = { v: 0 };
    tl.to(prog, { v: 100, duration: F, ease: 'power1.inOut', onUpdate: () => { const c = String(Math.round(prog.v)).padStart(3, '0'); if (c !== lastCnt) cnt.textContent = lastCnt = c; } }, 0);
    tl.addLabel('exit', F) /* keluar: seluruh adegan memudar, tirai terbelah atas dan bawah, hero menyusul */
      .to(svg, { scale: 1.06, autoAlpha: 0, transformOrigin: '50% 50%', duration: 0.6, ease: 'power2.inOut' }, 'exit')
      .to('.ic, .iskip', { autoAlpha: 0, duration: 0.5 }, 'exit')
      .to('.ip.top', { yPercent: -100, duration: 1.1, ease: 'power3.inOut' }, 'exit+=0.3')
      .to('.ip.bot', { yPercent: 100, duration: 1.1, ease: 'power3.inOut' }, 'exit+=0.3')
      .call(() => heroTl.play(), null, 'exit+=0.5');
    tl.eventCallback('onUpdate', render); render(); svg.style.opacity = 1;

    const doSkip = () => { if (intro.isConnected && tl.time() < tl.labels.exit) { cnt.textContent = '100'; tl.seek('exit'); } };
    intro.addEventListener('click', doSkip);
    addEventListener('keydown', (e) => ['Escape', ' ', 'Enter'].includes(e.key) && doSkip());

    /* mulai setelah halaman selesai dimuat (parsing + decode gambar bersaing dengan animasi kalau dimulai terlalu cepat), maksimal menunggu 2,5 dtk */
    const loaded = new Promise((r) => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
    Promise.race([loaded.then(() => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))), new Promise((r) => setTimeout(r, 2500))]).then(() => tl.play());

})();
</script>
</body></html>
